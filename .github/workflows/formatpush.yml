name: Format push

on:
  workflow_run:
    workflows:
      - Format
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: format-push-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  push:
    name: Push formatting changes
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download source metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            > "$RUNNER_TEMP/run.json"

      - name: Determine source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          EVENT="$(jq -r '.event' "$RUNNER_TEMP/run.json")"
          SHA="$(jq -r '.head_sha' "$RUNNER_TEMP/run.json")"

          echo "event=$EVENT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "pull_request" ]; then
            PR_NUMBER="$(
              gh api \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
                --jq '.pull_requests[0].number'
            )"

            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
              echo "Unable to determine pull request."
              exit 1
            fi

            PR_REPOSITORY="$(
              gh api \
                "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                --jq '.head.repo.full_name'
            )"

            PR_BRANCH="$(
              gh api \
                "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                --jq '.head.ref'
            )"

            PR_SHA="$(
              gh api \
                "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                --jq '.head.sha'
            )"

            if [ "$PR_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo "Fork pull requests are not modified."
              echo "repository=$PR_REPOSITORY" >> "$GITHUB_OUTPUT"
              echo "fork=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$PR_SHA" != "$SHA" ]; then
              echo "Workflow SHA does not match PR head SHA."
              exit 1
            fi

            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "branch=$PR_BRANCH" >> "$GITHUB_OUTPUT"
            echo "repository=$PR_REPOSITORY" >> "$GITHUB_OUTPUT"
            echo "fork=false" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "repository=$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
            echo "fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted formatter
        if: steps.source.outputs.fork != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        if: steps.source.outputs.fork != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn

      - name: Install trusted formatter
        if: steps.source.outputs.fork != 'true'
        run: yarn install --ignore-scripts

      - name: Download source at exact SHA
        if: steps.source.outputs.fork != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/source"
          mkdir -p "$RUNNER_TEMP/source"

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/tarball/${SOURCE_SHA}" \
            > "$RUNNER_TEMP/source.tar.gz"

          tar -xzf "$RUNNER_TEMP/source.tar.gz" \
            --strip-components=1 \
            -C "$RUNNER_TEMP/source"

      - name: Format source with trusted formatter
        if: steps.source.outputs.fork != 'true'
        env:
          SOURCE_DIR: ${{ runner.temp }}/source
        run: |
          set -euo pipefail

          yarn prettier --config "$GITHUB_WORKSPACE/package.json" --write \
            "$SOURCE_DIR/lib/**/*.js" \
            "$SOURCE_DIR/test/**/*.js" \
            "$SOURCE_DIR/**/*.json" \
            "$SOURCE_DIR/**/*.yml" \
            "$SOURCE_DIR/**/*.md" \
            "!$SOURCE_DIR/dist/**" \
            "!$SOURCE_DIR/.github/workflows/**"

      - name: Check for formatting changes
        if: steps.source.outputs.fork != 'true'
        id: changes
        env:
          SOURCE_DIR: ${{ runner.temp }}/source
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          git init -q
          git config user.name "format-check"
          git config user.email "format-check@example.invalid"

          git add -A
          FORMATTED_TREE="$(git write-tree)"

          git fetch --quiet \
            --no-tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "$SOURCE_SHA"

          ORIGINAL_TREE="$(git rev-parse FETCH_HEAD^{tree})"

          if [ "$FORMATTED_TREE" = "$ORIGINAL_TREE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No formatting changes required."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Formatting changes are required."
          fi

      - name: Create formatting commit
        if: steps.source.outputs.fork != 'true' && steps.changes.outputs.changed == 'true'
        id: commit
        env:
          SOURCE_DIR: ${{ runner.temp }}/source
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          TREE="$(git write-tree)"

          COMMIT="$(
            printf '%s\n\n' 'chore: format source' |
              git commit-tree "$TREE" -p "$SOURCE_SHA"
          )"

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Push formatting commit
        if: steps.source.outputs.fork != 'true' && steps.changes.outputs.changed == 'true'
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
          BRANCH: ${{ steps.source.outputs.branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$COMMIT:refs/heads/$BRANCH"
