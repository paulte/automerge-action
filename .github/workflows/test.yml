name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Run linting
        run: yarn lint

      - name: Debug ESLint dependencies
        run: |
          yarn why @eslint/js
          ls -la node_modules/@eslint/js
          node -p "require.resolve('@eslint/js')"
    
      - name: Run tests
        run: yarn test

      - name: Build
        run: yarn compile

      - name: Check compiled output
        run: git diff --exit-code -- dist/
