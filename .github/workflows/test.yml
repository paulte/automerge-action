name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Show environment
        run: |
          node --version
          yarn --version
          git --version
          git config --get init.defaultBranch || true
      - name: Run Git tests with tracing
        env:
          GIT_TRACE: 1
          GIT_TRACE_SETUP: 1
          GIT_TRACE_PACKET: 1
        run: yarn jest test/git.test.js --runInBand
