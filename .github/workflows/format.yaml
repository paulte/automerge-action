name: Format

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --ignore-scripts

      - name: Format source
        run: |
          yarn prettier --write \
            "lib/**/*.js" \
            "test/**/*.js" \
            "**/*.json" \
            "**/*.yml" \
            "**/*.yaml" \
            "**/*.md" \
            "!dist/**" \
            "!.github/workflows/**"

      - name: Create formatting patch
        run: |
          git diff --binary -- \
            ':!dist/**' \
            ':!.github/workflows/**' \
            > "$RUNNER_TEMP/format.patch"

      - name: Check for formatting changes
        id: changes
        run: |
          if [ -s "$RUNNER_TEMP/format.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Formatting changes are required."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No formatting changes required."
          fi

      - name: Upload formatting patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: formatting-patch-${{ github.sha }}
          path: ${{ runner.temp }}/format.patch
          if-no-files-found: error
          retention-days: 1
