name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --ignore-scripts

      - name: Format fixing
        run: yarn prettier --write "lib/**/*.js" "test/**/*.js"

      - name: Build
        run: yarn compile

      - name: Commit formatting, lockfile and build changes
        if: >
          github.event.pull_request.head.repo.full_name == github.repository ||
          github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add yarn.lock lib test dist

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: format and build"
            git push
          fi

      - name: Debug ESLint dependencies
        run: |
          yarn why @eslint/js
          ls -la node_modules/@eslint/js
          node -p "require.resolve('@eslint/js')"

      - name: Check formatting
        run: yarn prettier --check "lib/**/*.js" "test/**/*.js"

      - name: Run linting
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Verify build
        run: yarn compile

      - name: Check compiled output
        run: git diff --exit-code -- dist/
